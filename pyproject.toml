[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "pyax206"
version = "0.1.0"
description = "Python SDK for AX206-based USB LCD photo-frame displays (RGB565 BE)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name="Alexandre P"}]
keywords = ["ax206", "usb", "lcd", "rgb565", "pyusb"]
dependencies = [
  "pyusb>=1.2.1",
  "numpy>=1.22",
  "Pillow>=9.0",
]

[project.optional-dependencies]
mirror = ["mss>=9.0", "opencv-python>=4.7"]
video  = ["opencv-python>=4.7"]
all    = ["mss>=9.0", "opencv-python>=4.7"]

[project.scripts]
pyax206 = "pyax206.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pyax206"]
